<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow19" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow19-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="760" fill="url(#bg19)" rx="16"/>
  <rect x="2" y="2" width="956" height="756" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Title -->
  <text x="480" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">LƯU ĐỒ THUẬT TOÁN VÍ DỤ 19: HÀNG ĐỢI (QUEUE) TRONG ISR</text>
  <text x="480" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Truyền 5 số nguyên qua xIntegerQueue → ISR xử lý và gửi con trỏ chuỗi qua xStringQueue</text>

  <!-- Column 1: vIntegerGenerator -->
  <rect x="30" y="90" width="280" height="640" fill="#064e3b" fill-opacity="0.3" stroke="#22c55e" stroke-width="2" rx="10" stroke-dasharray="4 2"/>
  <rect x="40" y="100" width="260" height="32" fill="#15803d" rx="6"/>
  <text x="170" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">vIntegerGenerator (Ưu tiên 1)</text>

  <rect x="60" y="150" width="220" height="40" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" rx="20" filter="url(#shadow19)"/>
  <text x="170" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">vTaskDelayUntil(200ms)</text>

  <line x1="170" y1="190" x2="170" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <!-- Loop Diamond i < 5 -->
  <polygon points="170,220 250,250 170,280 90,250" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow19)"/>
  <text x="170" y="254" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle">i &lt; 5 ?</text>

  <line x1="170" y1="280" x2="170" y2="315" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="185" y="300" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">Đúng</text>

  <rect x="50" y="315" width="240" height="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="170" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">xQueueSendToBack(xIntegerQueue)</text>
  <text x="170" y="355" font-family="system-ui, sans-serif" font-size="10.5" fill="#4ade80" text-anchor="middle">★ THÔNG SỐ: ulValueToSend++, i++</text>

  <!-- Loop back i -->
  <path d="M 290 342 L 305 342 L 305 250 L 250 250" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow19)"/>

  <!-- False branch: i >= 5 -->
  <path d="M 90 250 L 45 250 L 45 400 L 70 400" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="50" y="330" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f87171" transform="rotate(-90 50 330)">Đủ 5 số</text>

  <rect x="50" y="380" width="240" height="40" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="170" y="405" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">In: About to generate interrupt</text>

  <line x1="170" y1="420" x2="170" y2="450" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <rect x="45" y="450" width="250" height="50" fill="#1e293b" stroke="#f97316" stroke-width="2" rx="8" filter="url(#shadow19)"/>
  <text x="170" y="470" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fb923c" text-anchor="middle">esp_timer_start_once(timer, 0)</text>
  <text x="170" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">★ KÍCH HOẠT NGẮT PHẦN CỨNG</text>

  <!-- Line trigger to ISR -->
  <path d="M 295 475 L 340 475 L 340 172 L 375 172" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrow19-orange)"/>

  <rect x="50" y="580" width="240" height="45" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="170" y="598" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">StringPrinter in xong -> Trả CPU</text>
  <text x="170" y="614" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">In: Generator task - Interrupt generated</text>

  <!-- Loop back start -->
  <path d="M 170 625 L 170 700 L 40 700 L 40 170 L 60 170" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <!-- Column 2: ISR -->
  <rect x="340" y="90" width="280" height="640" fill="#7c2d12" fill-opacity="0.3" stroke="#f97316" stroke-width="2" rx="10" stroke-dasharray="4 2"/>
  <rect x="350" y="100" width="260" height="32" fill="#c2410c" rx="6"/>
  <text x="480" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">vExampleInterruptHandler (ISR)</text>

  <rect x="375" y="150" width="210" height="45" fill="#1e293b" stroke="#f97316" stroke-width="1.5" rx="22" filter="url(#shadow19)"/>
  <text x="480" y="177" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Ngắt kích hoạt (Ngữ cảnh ISR)</text>

  <line x1="480" y1="195" x2="480" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <!-- While loop diamond -->
  <polygon points="480,230 585,265 480,300 375,265" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow19)"/>
  <text x="480" y="258" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#fde047" text-anchor="middle">xQueueReceiveFromISR</text>
  <text x="480" y="272" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#fde047" text-anchor="middle">!= errQUEUE_EMPTY?</text>

  <line x1="480" y1="300" x2="480" y2="335" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="495" y="320" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">Đúng</text>

  <rect x="355" y="335" width="250" height="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="480" y="354" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">★ THÔNG SỐ: ulReceivedNumber &amp;= 0x03</text>
  <text x="480" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Lấy 2 bit cuối làm chỉ mục: index ∈ {0,1,2,3}</text>

  <line x1="480" y1="380" x2="480" y2="405" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <rect x="355" y="405" width="250" height="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="480" y="424" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">xQueueSendToBackFromISR()</text>
  <text x="480" y="440" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">★ Gửi con trỏ &amp;pcStrings[index] vào xStringQueue</text>
  <text x="480" y="453" font-family="system-ui, sans-serif" font-size="9.5" fill="#4ade80" text-anchor="middle">Đánh thức StringPrinter -&gt; woken = pdTRUE</text>

  <!-- Loop back while -->
  <path d="M 605 432 L 620 432 L 620 265 L 585 265" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow19)"/>

  <!-- False branch while: Empty -->
  <path d="M 375 265 L 350 265 L 350 495 L 420 495" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="355" y="380" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f87171" transform="rotate(-90 355 380)">Queue rỗng</text>

  <!-- Decision woken -->
  <polygon points="480,470 580,505 480,540 380,505" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow19)"/>
  <text x="480" y="503" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle">woken == pdTRUE?</text>

  <line x1="480" y1="540" x2="480" y2="575" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="495" y="560" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">Đúng</text>

  <rect x="355" y="575" width="250" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="480" y="595" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">portYIELD_FROM_ISR(pdTRUE)</text>
  <text x="480" y="612" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">esp_timer_isr_dispatch_need_yield()</text>

  <line x1="480" y1="625" x2="480" y2="655" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <rect x="365" y="655" width="230" height="40" fill="#1e293b" stroke="#f97316" stroke-width="1.5" rx="20" filter="url(#shadow19)"/>
  <text x="480" y="675" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fb923c" text-anchor="middle">Thoát ISR</text>
  <text x="480" y="688" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Context Switch sang StringPrinter (Pri 2)</text>

  <!-- Line to StringPrinter -->
  <path d="M 595 675 L 635 675 L 635 172 L 685 172" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow19)"/>

  <!-- Column 3: vStringPrinter -->
  <rect x="650" y="90" width="280" height="640" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2" rx="10" stroke-dasharray="4 2"/>
  <rect x="660" y="100" width="260" height="32" fill="#1d4ed8" rx="6"/>
  <text x="790" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">vStringPrinter (Ưu tiên 2)</text>

  <rect x="685" y="150" width="210" height="45" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="22" filter="url(#shadow19)"/>
  <text x="790" y="177" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Được đánh thức (Pri 2 &gt; Pri 1)</text>

  <line x1="790" y1="195" x2="790" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <rect x="665" y="235" width="250" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="790" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">xQueueReceive(xStringQueue)</text>
  <text x="790" y="272" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Rút con trỏ chuỗi pcString ra</text>

  <line x1="790" y1="285" x2="790" y2="320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>

  <!-- Decision String Queue Empty -->
  <polygon points="790,320 890,355 790,390 690,355" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow19)"/>
  <text x="790" y="352" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle">Còn chuỗi?</text>

  <!-- Loop branch -->
  <line x1="790" y1="390" x2="790" y2="430" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="805" y="415" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">Có (5 lần)</text>

  <rect x="665" y="430" width="250" height="55" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="790" y="450" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">In Log: Printer received: [pcString]</text>
  <text x="790" y="470" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(String 0, 1, 2, 3, 0...)</text>

  <!-- Loop back to Receive -->
  <path d="M 915 455 L 935 455 L 935 260 L 915 260" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow19)"/>

  <!-- False branch: Blocked -->
  <line x1="690" y1="355" x2="650" y2="355" stroke="#fca5a5" stroke-width="2"/>
  <line x1="650" y1="355" x2="650" y2="520" stroke="#fca5a5" stroke-width="2"/>
  <line x1="650" y1="520" x2="665" y2="520" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrow19)"/>
  <text x="640" y="430" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f87171" transform="rotate(-90 640 430)">Hàng đợi rỗng</text>

  <rect x="665" y="500" width="250" height="55" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8" filter="url(#shadow19)"/>
  <text x="790" y="522" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">★ TRẠNG THÁI: BLOCKED</text>
  <text x="790" y="540" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">In xong 5 chuỗi -> Chờ lần ngắt kế tiếp</text>

  <!-- Handover CPU to Generator -->
  <path d="M 665 535 L 320 535 L 320 602 L 290 602" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow19)"/>
</svg>
